<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARGOS · Workspace</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div id="workspace" data-phase="idle">
 <div class="ambient" aria-hidden="true"></div><div class="grid-floor" aria-hidden="true"></div>
 <header class="app-header"><div class="wordmark"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M7 31 20 7 33 31 25 25 20 16 15 25Z"/></svg><span>ARGOS</span><i></i><span class="header-small">WORKSPACE / 01</span></div><div class="header-tools"><button id="microphone" aria-label="Silenciar micrófono" title="Preparando micrófono" aria-pressed="false"><svg width="17" height="20" viewBox="0 0 24 28" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="8" y="2" width="8" height="15" rx="4"/><path d="M4 12v3a8 8 0 0 0 16 0v-3M12 23v4M8 27h8"/></svg></button><button id="voice-output" aria-pressed="true" aria-label="Silenciar voz" title="Silenciar voz"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3Z"/><path class="voice-waves" d="M16 8a6 6 0 0 1 0 8M19 5a10 10 0 0 1 0 14"/><path class="voice-slash" d="m16 9 6 6m0-6-6 6"/></svg></button><button id="arrange" title="Organizar ventanas (Alt+A)" aria-label="Organizar ventanas">▦</button><button id="sound" aria-pressed="false" title="Activar sonidos" aria-label="Activar sonidos">♪</button><button id="fullscreen" title="Pantalla completa" aria-label="Pantalla completa">⛶</button><button id="visual-settings" title="Workspace y pantallas" aria-label="Workspace y pantallas">▤</button><button id="hide-workspace" title="Ocultar workspace" aria-label="Ocultar workspace">−</button><button id="exit" title="Salir de ARGOS" aria-label="Salir de ARGOS">×</button></div></header>
 <main id="desktop" aria-label="Espacio de ventanas ARGOS"></main>
 <section id="core" aria-label="ARGOS"><button id="core-button" aria-label="Controles de ARGOS"><canvas id="orb" width="900" height="900" aria-hidden="true"></canvas><div class="core-brand"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M14 81 50 15 86 81 65 66 50 39 35 66Z"/></svg><span>ARGOS</span><small id="core-state">PREPARANDO</small></div></button></section>
 <div id="phase-hint" aria-live="polite"></div>
 <aside id="core-menu" hidden aria-label="Controles de ARGOS"><div class="menu-label">ABRIR EN EL ESPACIO</div><button data-panel="desktop">Control de aplicaciones <span>10</span></button><button data-panel="project">Proyectos <span>08</span></button><button data-panel="conversation">Escribir a ARGOS <span>09</span></button><button data-panel="summary">Resumen <span>01</span></button><button data-panel="sources">Fuentes <span>02</span></button><button data-panel="browser">Navegador <span>03</span></button><button data-panel="files">Archivos <span>04</span></button><button data-panel="storage">Discos y particiones <span>06</span></button><button data-panel="maintenance">Desarrollo y autolog <span>07</span></button><button data-panel="agents">Agentes <span>05</span></button><div class="menu-separator"></div><button id="mute-voice">Silenciar voz <span>♪</span></button><button id="interrupt-voice">Detener respuesta <span>■</span></button><button id="clear-workspace">Cerrar paneles <span>⌫</span></button></aside>
 <div id="subtitle" aria-live="polite"><span class="speech-id">ARGOS</span><span id="subtitle-text">Preparando conversación…</span><div id="speech-wave" aria-hidden="true"></div></div>
 <footer><div><span class="status-dot"></span><span id="workspace-status">ESPACIO EN REPOSO</span><span class="footer-rule"></span><span id="window-count">00 VENTANAS</span></div><div class="footer-right"><span id="elapsed">00:00</span><span class="footer-rule"></span><span id="clock"></span></div></footer>
 <div id="window-dock" aria-label="Ventanas minimizadas"></div><div id="toast" role="status"></div>
</div>
<script type="module" src="/app.js"></script></body></html>
