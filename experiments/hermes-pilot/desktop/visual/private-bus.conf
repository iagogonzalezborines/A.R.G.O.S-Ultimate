<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only applications inside this disposable mount/network namespace can connect.
     No service directories: never activate portals or host desktop daemons. -->
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/run/av</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow own="*"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
  </policy>
</busconfig>
