[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argos-core"
version = "0.2.0"
description = "ARGOS: local-first agent core and quiet Linux console"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
argos = "argos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
argos = ["contracts/*.md"]
